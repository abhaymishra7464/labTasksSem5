<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let arr = [10, -5, 0, 8, -2, 0, 15];

        let positive = 0;
        let negative = 0;
        let zero = 0;

        for (let num of arr) {
            if (num > 0) {
                positive++;
            } else if (num < 0) {
                negative++;
            } else {
                zero++;
            }
        }

        console.log("Positive:", positive);
        console.log("Negative:", negative);
        console.log("Zero:", zero);
    </script>
</body>
</html>
