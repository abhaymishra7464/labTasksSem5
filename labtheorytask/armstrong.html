<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello
    </h1>

    <script>
        for (let num = 100; num <= 999; num++) {
        let digits = String(num);
        let power = digits.length;
        let sum = 0;

        for (let digit of digits) {
            sum += Number(digit) ** power;
        }

        if (sum === num) {
            console.log(num);
        }
    }
    </script>
</body>
</html>
