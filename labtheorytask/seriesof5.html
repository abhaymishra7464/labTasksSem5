<!DOCTYPE html>
<html lang="en">

<body>
    

    <script>
        let i = 5;
        let sum = 0;

        do {
            console.log(i);
            sum += i;
            i += 5;
        } while (i <= 100);

        console.log("Total Sum:", sum);
    </script>
